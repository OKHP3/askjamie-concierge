title: "Skill request: "
body:
  - type: markdown
    attributes:
      value: "Describe the task without sharing personal or confidential information."
  - type: textarea
    id: goal
    attributes:
      label: What would you like help with?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good result look like?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Which agent platform do you use?
