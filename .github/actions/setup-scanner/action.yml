name: Set up skill scanner
description: Install the pinned security scanner
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
        check-latest: true
        cache: pip
        cache-dependency-path: packages/trust-pipeline/requirements.txt
    - run: |
        python -m venv .venv
        .venv/bin/python -m pip install -r packages/trust-pipeline/requirements.txt
      shell: bash
