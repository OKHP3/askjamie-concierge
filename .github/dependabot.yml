version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      compatible-workspace:
        patterns: ['*']
        update-types: [minor, patch]
      react-major:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [major]
    # Node types follow the supported runtime; promote both in one reviewed PR.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /packages/trust-pipeline
    schedule:
      interval: daily
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    # Explicitly include local composite actions as well as workflow files.
    directories:
      - /
      - /.github/actions/setup-node
      - /.github/actions/setup-scanner
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      compatible-actions:
        patterns: ['*']
        update-types: [minor, patch]
