name: Technology watch
on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/technology-watch.yml'
      - '.github/dependabot.yml'
      - 'scripts/technology-*.ts'
permissions:
  contents: read
concurrency:
  group: technology-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Fresh runtime patches and Python transitive resolutions must still pass all release gates.
  validation:
    # Pull requests already run Release validation independently.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/release-validation.yml
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-scanner
      - run: pnpm technology:audit
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: technology-inventory
          path: .data/technology/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
