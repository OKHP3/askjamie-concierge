name: Release validation
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [catalog-integrity, structural-validation, deduplication-check, publishing-trigger-check, validation-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm exec tsx scripts/check.ts "${{ matrix.check }}"
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-scanner
      - run: pnpm exec tsx scripts/scanner-smoke.ts
      - run: pnpm scan
      - run: pnpm exec tsx scripts/check.ts security-admission
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trust-evidence
          path: .data/assessments.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  build-verification:
    needs: [checks, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trust-evidence
          path: .data
      - run: pnpm build
      - run: pnpm exec tsx scripts/check.ts build-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: concierge-dist
          path: apps/concierge/dist
          if-no-files-found: error
          retention-days: 14
