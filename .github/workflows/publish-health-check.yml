name: Publish health check
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: [Deploy Pages, Scheduled re-audit]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: read
  issues: write
concurrency:
  group: publish-health
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm exec tsx scripts/publish-health.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_HEALTH_WEBHOOK_URL: ${{ secrets.PUBLISH_HEALTH_WEBHOOK_URL }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-health-state
          path: .data/health-state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
