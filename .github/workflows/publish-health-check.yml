name: Publish health check
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: [Deploy Pages, Scheduled re-audit]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: read
  issues: write
concurrency:
  group: publish-health
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["success","failure","timed_out","action_required"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm exec tsx scripts/publish-health.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_HEALTH_WEBHOOK_URL: ${{ secrets.PUBLISH_HEALTH_WEBHOOK_URL }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-health-state
          path: .data/health-state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
