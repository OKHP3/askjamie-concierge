name: Scheduled re-audit
on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-scanner
      - id: scan
        continue-on-error: true
        run: pnpm scan
      - if: always()
        run: pnpm exec tsx scripts/audit-report.ts
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
      - if: steps.scan.outcome == 'failure'
        run: exit 1
      - name: Validate code and publishing policy before re-audit publication
        run: |
          pnpm exec tsx scripts/check.ts validation-smoke
          pnpm exec tsx scripts/check.ts publishing-trigger-check
      - run: pnpm exec tsx scripts/prepare-public.ts --reaudit
      - run: pnpm --filter @askjamie/concierge build
      - run: pnpm exec tsx scripts/stamp-build.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scheduled-trust-evidence
          path: .data/assessments.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/concierge/dist
  deploy:
    needs: audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
